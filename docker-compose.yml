name: awaaz-estate
x-runtime: &runtime
  image: awaaz-estate:local
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://awaaz:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/awaaz
    API_HOST: 0.0.0.0
    VOICE_ENABLED: ${VOICE_ENABLED:-true}
  volumes:
    - ./secrets:/app/secrets:ro
    - voice-artifacts:/app/artifacts
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: awaaz
      POSTGRES_USER: awaaz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U awaaz -d awaaz]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *runtime
    working_dir: /app/backend
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *runtime
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  website:
    profiles: [website]
    build:
      context: .
      dockerfile: website/Dockerfile
    environment:
      AWAAZ_API_URL: http://api:8000
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      ASSISTANT_URL: ${ASSISTANT_URL:-http://localhost:8080/assistant/}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      CONTACT_PHONE: ${CONTACT_PHONE:-}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [CMD, node, -e, "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  proxy:
    profiles: [website]
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    ports: ["127.0.0.1:${WEBSITE_PORT:-8080}:8080"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      website:
        condition: service_healthy
      api:
        condition: service_healthy
  worker:
    <<: *runtime
    command: [python, worker.py]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
  n8n:
    profiles: [automation]
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.40.7}
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      AWAAZ_CRM_WEBHOOK_URL: ${AWAAZ_CRM_WEBHOOK_URL:-}
      GENERIC_TIMEZONE: Asia/Karachi
      TZ: Asia/Karachi
    volumes:
      - n8n-data:/home/node/.n8n
volumes:
  postgres-data:
  voice-artifacts:
  n8n-data:
