[project]
name = "awaaz-tts-service"
version = "0.1.0"
description = "Isolated local multilingual speech synthesis workers for Awaaz Estate"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Install each engine into its own virtual environment. Their Transformers pins conflict.
parler = [
  "torch>=2.5,<3",
  "huggingface-hub>=0.26,<1",
  "transformers==4.46.1",
  "parler-tts @ git+https://github.com/huggingface/parler-tts.git@d108732cd57788ec86bc857d99a6cabd66663d68",
]
chatterbox = [
  "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2",
  "huggingface-hub>=1.3,<2",
]

[tool.uv]
conflicts = [[{ extra = "parler" }, { extra = "chatterbox" }]]
override-dependencies = [
  "resemble-perth @ git+https://github.com/resemble-ai/Perth.git@ff1c8ac55a976971245cdd53c18d6131ca00d993",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
