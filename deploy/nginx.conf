# Include in Nginx's http context, for example /etc/nginx/conf.d/default.conf.
map $http_upgrade $awaaz_connection_upgrade {
    default upgrade;
    ''      close;
}

# Query strings, cookies and authorization headers are deliberately omitted.
log_format awaaz '$remote_addr [$time_local] "$request_method $uri" '
                 '$status $body_bytes_sent request_id=$request_id '
                 'duration=$request_time upstream_duration=$upstream_response_time';

upstream awaaz_website {
    server website:3000;
}

upstream awaaz_api {
    server api:8000;
}

# Add the real staging/production hostname to the application server below.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    access_log /dev/stdout awaaz;
    error_log /dev/stderr warn;
    return 444;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;
    server_tokens off;

    # Local HTTP default. Behind a private TLS terminator, change to https.
    # Do not trust a caller-supplied X-Forwarded-Proto header.
    set $awaaz_external_scheme $scheme;

    access_log /dev/stdout awaaz;
    error_log /dev/stderr warn;

    # Decimal bytes: matches FastAPI's default MAX_UPLOAD_BYTES.
    client_max_body_size 10000000;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self)" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $awaaz_external_scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Forwarded "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $awaaz_connection_upgrade;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream off;
    # Preserve Next.js streaming and any FastAPI streaming responses.
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_cache off;

    location = /assistant {
        return 308 /assistant/;
    }

    location /assistant/ {
        proxy_pass http://awaaz_api;
    }

    # Explicit WebSocket routes take precedence over the /v1/ prefix.
    location ~ ^/v1/(voice|telephony/media)$ {
        proxy_pass http://awaaz_api;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Covers the legacy voice route and future FastAPI sockets under /ws/.
    location /ws/ {
        proxy_pass http://awaaz_api;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /v1/ {
        proxy_pass http://awaaz_api;
    }

    location = /healthz {
        proxy_pass http://awaaz_api;
    }

    location = /readyz {
        proxy_pass http://awaaz_api;
    }

    # Public pages, Next.js assets, metadata, and Next route handlers.
    location / {
        proxy_pass http://awaaz_website;
    }
}
