name: awaaz-estate-ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: awaaz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d awaaz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/awaaz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e 'backend[dev,local-rag]'
      - run: python -m ruff check backend/app backend/tests scripts
      - name: Require PostgreSQL for backend integration tests
        run: >-
          python -c "from app.repositories.database import engine;
          assert engine.dialect.name == 'postgresql',
          f'Expected PostgreSQL for integration tests, got {engine.dialect.name}'"
      - run: python -m pytest backend/tests
      - run: python scripts/evaluation/evaluate_appointments.py
      - run: python scripts/evaluation/evaluate_conversations.py
      - run: cd backend && DATABASE_URL=sqlite:///./ci-migrations.db alembic upgrade head
      - run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE awaaz_migrations"
      - run: cd backend && DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/awaaz_migrations alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run typecheck --prefix website
      - run: npm run build --prefix website
