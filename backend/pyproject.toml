[project]
name = "awaaz-estate"
version = "0.1.0"
description = "Grounded UrduLish real-estate voice-agent capstone"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3",
  "langgraph>=0.2,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.6,<1"]
voice-local = ["torch>=2.5,<3", "transformers>=4.43,<5", "numpy>=1.26,<3"]
voice-deepgram = ["deepgram-sdk>=7,<8"]
voice-openai = ["websockets>=13,<16"]
voice-fish = ["fish-audio-sdk>=1,<2"]
voice-elevenlabs = ["httpx>=0.27,<1"]
google = ["google-api-python-client>=2.160,<3", "google-auth-httplib2>=0.2,<1", "google-auth-oauthlib>=1.2,<2"]
providers = ["openai>=1.50,<2", "pinecone>=6,<8"]
ingestion = ["pypdf>=5,<6"]
telephony = ["httpx>=0.27,<1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
